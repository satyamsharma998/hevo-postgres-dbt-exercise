version: 2

# Raw tables loaded into Snowflake by the Hevo pipeline (PostgreSQL -> Snowflake).
# Database and schema names are supplied through environment variables so that
# nothing environment-specific is hardcoded in the project.
sources:
  - name: hevo_raw
    database: "{{ env_var('DBT_SOURCE_DATABASE') }}"
    schema: "{{ env_var('DBT_SOURCE_SCHEMA') }}"
    tables:
      - name: raw_customers
        columns:
          - name: id
            tests: [unique, not_null]
      - name: raw_orders
        columns:
          - name: id
            tests: [unique, not_null]
          - name: user_id
            tests:
              - relationships:
                  arguments:
                    to: source('hevo_raw', 'raw_customers')
                    field: id
      - name: raw_payments
        columns:
          - name: id
            tests: [unique, not_null]
          - name: order_id
            tests:
              - relationships:
                  arguments:
                    to: source('hevo_raw', 'raw_orders')
                    field: id
